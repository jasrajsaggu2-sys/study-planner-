<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GradeUp – Exam & Syllabus Planner</title>
<style>
:root{--bg:#07102b;--card:rgba(18,36,92,.55);--tx:#eaf0ff;--mu:#9fb3e8;--ac:#5b8cff;--ac2:#2dd4a7;--bd:rgba(120,150,255,.22);--warn:#f5a524;--bad:#ef4444;--g1:rgba(59,111,255,.38);--g2:rgba(124,92,255,.30);--g3:rgba(14,165,233,.28);--b1:#040a20;--b2:#0a1b4d;--b3:#06112e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:#07132f;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:960px;margin:0 auto;padding:16px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0}h1 span{color:var(--ac)}h2{font-size:16px;margin:0 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap;font:inherit}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:90px;resize:vertical}
button.b{background:var(--ac);color:#fff;border:0;padding:9px 14px;border-radius:9px;cursor:pointer;font:inherit}
button.b.g{background:transparent;color:var(--mu);border:1px solid var(--bd)}
button.b:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac2)}
.big{font-size:28px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tp{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--bd)}
.tp.d span.n{text-decoration:line-through;color:var(--mu)}.tp .n{flex:1}
.tp select{width:auto;padding:3px}
.pill{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
.out{white-space:pre-wrap;line-height:1.6}
.out b{color:var(--ac)}
.hide{display:none}
.opt{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:9px;margin-top:6px;cursor:pointer}.opt.ok{border-color:var(--ac2);background:rgba(18,184,136,.18)}.opt.no{border-color:var(--bad);background:rgba(224,49,49,.18)}.ex{background:var(--bad);color:#fff;border-radius:9px;padding:6px 10px;margin-bottom:6px;font-weight:600}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px}.g3 label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}.g3 input,.g3 button{width:100%}.sr{border-top:1px solid var(--bd);padding:10px 0}
.card{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,10,50,.35)}input,select,textarea{background:rgba(5,12,40,.6)!important}h1 span{background:linear-gradient(90deg,#6ea0ff,#9d8cff);-webkit-background-clip:text;background-clip:text;color:transparent}.tab.on{box-shadow:0 0 18px rgba(91,140,255,.55)}.bar i{background:linear-gradient(90deg,#2dd4a7,#5b8cff)}
:root[data-v="royal"]{--g1:rgba(59,111,255,.55);--g2:rgba(30,64,175,.5);--g3:rgba(56,189,248,.3);--b1:#041246;--b2:#0f3bb3;--b3:#061a5c;--ac:#4d7cff;--card:rgba(20,50,150,.55);--bg:#07163f}:root[data-v="ocean"]{--g1:rgba(14,165,233,.45);--g2:rgba(34,211,238,.28);--g3:rgba(20,184,166,.28);--b1:#021a33;--b2:#0a4a7a;--b3:#032a4a;--ac:#38bdf8;--card:rgba(10,70,120,.55);--bg:#04213d}:root[data-v="indigo"]{--g1:rgba(109,93,252,.5);--g2:rgba(167,139,250,.32);--g3:rgba(59,130,246,.28);--b1:#080530;--b2:#2a1a7a;--b3:#120a52;--ac:#8b7bff;--card:rgba(50,30,130,.55);--bg:#0b0733}:root[data-v="steel"]{--g1:rgba(91,127,168,.45);--g2:rgba(148,163,184,.25);--g3:rgba(56,110,170,.28);--b1:#0a1428;--b2:#233a5c;--b3:#0e1d38;--ac:#7ea6d8;--card:rgba(35,58,92,.6);--bg:#0c172c}:root[data-v="sky"]{--g1:rgba(56,189,248,.5);--g2:rgba(125,211,252,.3);--g3:rgba(59,130,246,.35);--b1:#05264d;--b2:#1a6fb8;--b3:#0a3a73;--ac:#7dd3fc;--card:rgba(20,100,170,.5);--bg:#072c58}.sw{display:flex;gap:8px;align-items:center;margin:0 0 12px}.dot{width:28px;height:28px;border-radius:50%;border:2px solid rgba(255,255,255,.3);cursor:pointer;padding:0}.dot.on{border-color:#fff;box-shadow:0 0 12px var(--ac)}h1 span{background:linear-gradient(90deg,var(--ac),#c4b5fd)!important;-webkit-background-clip:text!important;background-clip:text!important}
@property --g1{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --g2{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --g3{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --b1{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --b2{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --b3{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --ac{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --card{syntax:"<color>";inherits:true;initial-value:#0a1a4a}@property --bg{syntax:"<color>";inherits:true;initial-value:#0a1a4a}
:root{transition:--g1 5s ease,--g2 5s ease,--g3 5s ease,--b1 5s ease,--b2 5s ease,--b3 5s ease,--ac 5s ease,--card 5s ease,--bg 5s ease}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.cd{min-height:60px;border:1px solid var(--bd);border-radius:8px;padding:3px;font-size:12px;cursor:pointer;overflow:hidden}.cd.today{border-color:var(--ac2)}.cd.sel{background:rgba(91,140,255,.28)}.cx{color:#ff7b7b}
/* ===== GradeUp v2: gamification layer ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 0 rgba(91,140,255,.55)}50%{box-shadow:0 0 22px 4px rgba(91,140,255,.55)}}
@keyframes flame{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
@keyframes shimmer{to{background-position:200% 0}}
#view>.card,#view>.grid>.card{animation:fadeUp .4s ease both}
.card{transition:transform .2s ease,border-color .2s ease}
.card:hover{border-color:rgba(120,150,255,.5)}
.hero{position:relative;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:16px;border-radius:18px;margin-bottom:12px;border:1px solid var(--bd);
 background:linear-gradient(120deg,rgba(91,140,255,.28),rgba(124,92,255,.22),rgba(45,212,167,.18));background-size:200% 100%;animation:shimmer 12s linear infinite,fadeUp .4s ease both;box-shadow:0 8px 30px rgba(0,10,50,.35)}
.lvl{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--ac),#9d8cff);color:#fff;font-weight:800;line-height:1;animation:pulseGlow 3s ease-in-out infinite;flex:none}
.lvl small{font-size:9px;font-weight:600;letter-spacing:.08em;opacity:.85}.lvl b{font-size:24px}
.hmid{flex:1;min-width:200px}
.hmid .gr{font-size:18px;font-weight:700}
.xpb{height:10px;border-radius:9px;background:rgba(0,0,0,.35);overflow:hidden;margin:6px 0 2px}
.xpb i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#2dd4a7,#5b8cff,#c4b5fd);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.fl{display:inline-block;animation:flame 1.2s ease-in-out infinite}
.ring{position:relative;width:84px;height:84px;flex:none}.ring svg{width:100%;height:100%}
.ring circle{transition:stroke-dashoffset 1s ease}
.rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.rt b{font-size:22px}.rt span{font-size:10px;color:var(--mu)}
.qt{width:100%;font-style:italic;color:var(--mu);font-size:13px;border-top:1px dashed var(--bd);padding-top:8px}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 0}.qrow .bar{flex:1}
.qdone{opacity:.7}.qdone .qn{text-decoration:line-through}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:100;pointer-events:none;
 background:linear-gradient(90deg,#2dd4a7,#5b8cff);color:#04122e;font-weight:700;padding:10px 18px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:all .3s ease;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:99}
@media (prefers-reduced-motion:reduce){.hero,.lvl,.fl,#view>.card,#view>.grid>.card{animation:none!important}}

.dq{display:block;margin:10px auto;width:100%;max-width:300px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.upi{font-size:18px;font-weight:700;letter-spacing:.02em;word-break:break-all}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 14px;cursor:pointer;font:inherit}
.chip.on{background:var(--ac2);color:#04122e;border-color:var(--ac2);font-weight:700}
a.b{display:inline-block;text-decoration:none;background:var(--ac);color:#fff;padding:9px 14px;border-radius:9px}
</style></head><body><div class="w">
<header><h1>🎓 Grade<span>Up</span></h1><div class="mu">Plan smart. Study smarter. Score higher.</div></header>
<div class="tabs" id="tabs"></div>
<div id="view"></div>
</div>
<script>
const $=s=>document.querySelector(s);
let S={subjects:[],tasks:[],results:[],notes:{},cards:[],log:[],tab:"dash",sel:null};
try{const x=localStorage.getItem("gradeup");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("gradeup",JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=d=>d?Math.ceil((new Date(d+"T00:00:00")-new Date().setHours(0,0,0,0))/864e5):null;
const prog=s=>s.topics.length?Math.round(s.topics.filter(t=>t.done).length/s.topics.length*100):0;
const TABS=[["dash","📊 Dashboard"],["subj","📚 Subjects"],["plan","🗓 Planner"],["cal","📆 Calendar"],["test","📝 Tests"],["cards","🃏 Flashcards"],["notes","📓 Notes"],["ai","🤖 AI Tutor"],["stats","📈 Stats"],["calc","🧮 Calculator"],["focus","⏱ Focus"],["donate","💝 Donate"]];
let AI=null;
(async()=>{try{AI=await claude.use("sample");render()}catch(e){}})();
function ai(prompt,el,json,op){
  if(!AI){el.innerHTML="AI isn't available in this view. Open the page inside Claude.";return Promise.resolve(null)}
  el.textContent="Thinking…";
  const sys="You are an expert exam coach helping a student get top grades. Be concise, concrete and encouraging. ";
  return json?AI.json(sys+prompt,op).catch(e=>{el.textContent="AI error: "+(e.message||e.code);return null})
   :AI(sys+prompt,{onText:({text})=>{el.innerHTML=fmt(text)}}).then(r=>{el.innerHTML=fmt(r.text)}).catch(e=>{el.textContent="AI error: "+(e.message||e.code)});
}
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^#+\s*(.+)$/gm,"<b>$1</b>");
function ctx(s){return `Subject: ${s.name}. Exam in ${days(s.date)??"unknown"} days. Target score: ${tg(s)}. Topics (confidence 1=weak..3=strong, done?): `+s.topics.map(t=>`${t.name} [c${t.conf}${t.done?",done":""}]`).join("; ")}
function render(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab ${S.tab==k?"on":""}" onclick="S.tab='${k}';save();render()">${l}</button>`).join("");
  ({dash,subj,plan:planv,cal:calv,test:testv,cards:cardv,notes:notev,ai:aiv,stats:statv,calc:calcv,focus,donate:donatev})[S.tab]();
  if(!(S.tab=="test"&&TS&&TS.qs&&!TS.done))$("#view").insertAdjacentHTML("beforeend",resetCard());
}
function dash(){
  const ss=[...S.subjects].sort((a,b)=>(days(a.date)??999)-(days(b.date)??999));
  const all=S.subjects.flatMap(s=>s.topics),done=all.filter(t=>t.done).length;
  const weak=S.subjects.flatMap(s=>s.topics.filter(t=>!t.done&&t.conf==1).map(t=>[s.name,t.name])).slice(0,6);
  $("#view").innerHTML=`<div class="grid">
  <div class="card"><div class="mu">Overall syllabus covered</div><div class="big">${all.length?Math.round(done/all.length*100):0}%</div><div class="bar"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div>
  <div class="card"><div class="mu">Next exam</div><div class="big">${ss[0]&&ss[0].date?days(ss[0].date)+" days":"—"}</div><div class="mu">${ss[0]?esc(ss[0].name)+(ss[0].date?" · "+fd(ss[0].date):""):"Add a subject to begin"}</div></div>
  ${todayCard()}
  <div class="card"><div class="mu">Average test score</div><div class="big">${avgAll()}</div><div class="mu">${S.results.length} result(s) logged</div></div>
  <div class="card"><div class="mu">Subjects studied this week</div><div class="big">${(c=>c.filter(x=>x.n).length+"/"+c.length)(cov(0))}</div><div class="mu">have a session scheduled · see Planner</div></div>
  <div class="card"><div class="mu">Weak topics to fix first</div>${weak.length?weak.map(w=>`<div>⚠️ ${esc(w[1])} <span class="mu">· ${esc(w[0])}</span></div>`).join(""):'<div class="mu">None flagged 🎉</div>'}</div></div>
  <div class="card"><h2>Exam countdown</h2>${ss.length?ss.map(s=>{const d=days(s.date);return `<div class="row"><b style="min-width:120px">${esc(s.name)}</b><div class="bar" style="flex:1;min-width:120px"><i style="width:${prog(s)}%"></i></div><span class="pill">Syllabus ${prog(s)}%</span><span class="pill">Ready ${ready(s)==null?"—":ready(s)+"%"}</span><span class="pill">Score ${avgS(s.id)}</span>${s.target?`<span class="pill">Target ${tg(s)}</span>`:""}<span class="pill" style="${d!=null&&d<=7?"background:var(--bad);color:#fff":""}">${d==null?"no date":d<0?"done":d+"d left"}</span><span class="mu">${fd(s.date)}</span></div>`}).join(""):'<div class="mu">No subjects yet. Go to Subjects and add your first one.</div>'}</div>
  <div class="card"><h2>🤖 Today's AI game plan</h2><button class="b" onclick="today()" ${S.subjects.length?"":"disabled"}>Generate for me</button><div class="out" id="o" style="margin-top:10px"></div></div>`;
}
function today(){const o=$("#o");ai("Create a realistic study plan for TODAY (about 3 hours) across these subjects, prioritising closest exams and weakest topics. Use time blocks and include one active-recall task. Data:\n"+S.subjects.map(ctx).join("\n"),o)}
function subj(){
  const s=S.subjects.find(x=>x.id==S.sel)||S.subjects[0];
  $("#view").innerHTML=`<div class="card"><h2>Add subject <span class="mu">(start date · end/exam date)</span></h2><div class="g3"><label>Subject<input id="n" placeholder="e.g. Physics"></label><label>Start date<input id="sd" type="date"></label><label>End date (study ends)<input id="ed" type="date"></label><label>Exam date<input id="d" type="date"></label><label>Target %<input id="t" type="number" min="1" max="100" placeholder="e.g. 85"></label><label>&nbsp;<button class="b" onclick="addS()">Add subject</button></label></div></div>
  ${datesCard()}
  <div class="row">${S.subjects.map(x=>`<button class="tab ${s&&s.id==x.id?"on":""}" onclick="S.sel='${x.id}';save();render()">${esc(x.name)}</button>`).join("")}</div>
  ${s?`<div class="card"><div class="top"><div><h2>${esc(s.name)}</h2><div class="row"><span class="mu">📅 Exam date</span><input type="date" style="width:auto" value="${s.date||""}" onchange="setD('${s.id}',this.value)"><span class="mu">${s.date?fd(s.date)+" ("+days(s.date)+" days left) · ":""}Target: ${tg(s)} · Avg: ${avgS(s.id)}${gap(s)}</span></div></div><button class="b g" onclick="delS('${s.id}')">${DC==s.id?"Tap again to confirm":"Delete"}</button></div>
  <div class="bar" style="margin:8px 0"><i style="width:${prog(s)}%"></i></div><div class="mu">🔁 Ticking a topic done adds revision reminders to the planner after 1, 3 and 7 days.</div>
  <div class="row"><input id="nt" placeholder="Add a topic / chapter" style="flex:1" onkeydown="if(event.key=='Enter')addT('${s.id}')"><button class="b" onclick="addT('${s.id}')">Add</button></div>
  ${s.topics.map(t=>`<div class="tp ${t.done?"d":""}"><input type="checkbox" style="width:auto" ${t.done?"checked":""} onchange="tog('${s.id}','${t.id}')"><span class="n">${esc(t.name)}</span><select onchange="conf('${s.id}','${t.id}',this.value)">${[[1,"🔴 Weak"],[2,"🟠 Okay"],[3,"🟢 Strong"]].map(([v,l])=>`<option value="${v}" ${t.conf==v?"selected":""}>${l}</option>`).join("")}</select><button class="b g" onclick="delT('${s.id}','${t.id}')">✕</button></div>`).join("")||'<div class="mu">No topics yet.</div>'}
  </div>
  <div class="card"><h2>✨ Import syllabus with AI</h2><textarea id="sy" placeholder="Paste your syllabus text here and AI will split it into topics…"></textarea><div class="row"><button class="b" onclick="imp('${s.id}')">Extract topics</button></div><div class="mu" id="io"></div></div>`:'<div class="card mu">Add a subject above to start.</div>'}`;
}
const find=(a,b)=>{const s=S.subjects.find(x=>x.id==a);return [s,s&&b?s.topics.find(t=>t.id==b):null]};
function addS(){const n=$("#n").value.trim();if(!n)return;if(S.subjects.length>=8)return alert("Maximum 8 subjects.");const s={id:uid(),name:n,start:$("#sd").value||ymd(new Date()),end:$("#ed").value,date:$("#d").value,target:Math.min(100,Math.max(0,+$("#t").value))||"",topics:[]};S.subjects.push(s);S.sel=s.id;save();render()}
let DC="";
function delS(id){if(DC!=id){DC=id;return render()}DC="";{S.subjects=S.subjects.filter(x=>x.id!=id);S.sel=null;save();render()}}
function addT(id){const v=$("#nt").value.trim();if(!v)return;find(id)[0].topics.push({id:uid(),name:v,conf:1,done:false});save();render()}
function tog(a,b){const [s,t]=find(a,b);t.done=!t.done;if(t.done)[1,3,7].forEach(n=>{const k=ymd(addDays(new Date(),n));if(s.date&&k>=s.date)return;if(!S.tasks.some(x=>x.sid==s.id&&x.date==k&&x.title=="Revise: "+t.name))S.tasks.push({id:uid(),date:k,sid:s.id,title:"Revise: "+t.name,min:20,done:false})});save();render()}
function conf(a,b,v){find(a,b)[1].conf=+v;save()}
function delT(a,b){const s=find(a)[0];s.topics=s.topics.filter(t=>t.id!=b);save();render()}
async function imp(id){const txt=$("#sy").value.trim();if(!txt)return;const o=$("#io");
  const r=await ai('Extract a clean list of study topics (max 40, short names) from this syllabus. Reply ONLY with JSON: {"topics":["..."]}\n\n'+txt,o,true);
  if(r&&r.topics){const s=find(id)[0];r.topics.forEach(n=>s.topics.push({id:uid(),name:String(n),conf:1,done:false}));save();render()}}
function aiv(){
  const opts=S.subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  $("#view").innerHTML=!S.subjects.length?'<div class="card mu">Add a subject first, then come back for your AI tutor.</div>':`
  <div class="card"><h2>Choose subject</h2><select id="as" onchange="topicOpts()">${opts}</select><div class="row" id="to"></div></div>
  <div class="grid">
  ${[["plan","📅 Full study plan","Build day-by-day plan to the exam"],["quiz","❓ Quiz me","5 exam-style questions on the topic"],["explain","💡 Explain simply","Clear explanation with examples"],["cards","🗂 Flashcards","10 active-recall flashcards"],["tips","🏆 Grade-boosting tips","Exam technique & mark-scheme strategy"],["mem","🧠 Memory tricks","Mnemonics & analogies"],["review","📈 Analyse my results","Coach reviews your scores & weak spots"]].map(([k,t,d])=>`<div class="card"><h2>${t}</h2><div class="mu">${d}</div><div class="row"><button class="b" onclick="run('${k}')">Go</button></div></div>`).join("")}</div>
  <div class="card"><h2>Ask anything</h2><div class="row"><input id="q" placeholder="e.g. How do I improve my essay marks?" style="flex:1" onkeydown="if(event.key=='Enter')run('ask')"><button class="b" onclick="run('ask')">Ask</button></div></div>

function nt(){const h=tq.shift();if(!h){tb=false;return}tb=true;te.innerHTML=h;te.classList.add("show");setTimeout(()=>{te.classList.remove("show");setTimeout(nt,300)},2200)}
const cv=document.createElement("canvas");cv.id="cf";document.body.appendChild(cv);
const cx=cv.getContext("2d");let P=[],on=false;
function boom(n){if(RM)return;cv.width=innerWidth;cv.height=innerHeight;
 for(let i=0;i<(n||100);i++)P.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.4,vx:(Math.random()-.5)*13,vy:-Math.random()*13-3,r:3+Math.random()*4,c:"hsl("+Math.random()*360+",90%,60%)",l:90+Math.random()*40});
 if(!on){on=true;requestAnimationFrame(fr)}}
function fr(){cx.clearRect(0,0,cv.width,cv.height);P=P.filter(p=>p.l>0);
 P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.l--;cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.r,p.r*1.6)});
 if(P.length)requestAnimationFrame(fr);else{on=false;cx.clearRect(0,0,cv.width,cv.height)}}

/* XP + quests */
function gain(n,msg){const a=LV(S.xp);S.xp+=n;const b=LV(S.xp);save();
 toast("+"+n+" XP · "+msg);
 if(b>a){toast("🎉 Level "+b+": "+ttl(b)+"!");boom(160)}}
function bump(k){const q=qd();q[k]++;
 QS.forEach(([key,n,l])=>{if(key==k&&q[k]>=n&&!q.paid[key]){q.paid[key]=1;gain(20,"Quest complete: "+l);boom(70)}});save()}

/* wrap game events (guards stop XP farming by untick/retick) */
const _tog=window.tog;
window.tog=function(a,b){const t=find(a,b)[1];if(t&&!t.done&&!t.xpd){t.xpd=1;gain(15,"Topic mastered");bump("top");boom(50)}_tog(a,b)};
const _togP=window.togP;
window.togP=function(id){const x=S.tasks.find(t=>t.id==id);if(x&&!x.done&&!x.xpd){x.xpd=1;gain(10+Math.round(x.min/10),"Session done");bump("sess");boom(40)}_togP(id)};
const _sub=window.submitT;
window.submitT=function(){const was=TS&&TS.done;_sub();if(TS&&TS.done&&!was){gain(TS.sc*5+10,"Test finished: "+TS.pct+"%");if(TS.pct>=80)boom(160)}};
const _rate=window.rate;
window.rate=function(ok){if(ok)gain(3,"Card nailed");bump("rev");_rate(ok)};
const _logF=window.logF;
window.logF=function(){if(T.mode>5&&FS&&S.subjects.some(s=>s.id==FS)){gain(Math.round(T.mode/2),"Deep focus");boom(60)}_logF()};

/* UI */
function hero(){
 const l=LV(S.xp),b=base(l),n=base(l+1),pc=Math.round((S.xp-b)/(n-b)*100),h=new Date().getHours(),st=streak();
 const gr=h<5?"Burning the midnight oil":h<12?"Good morning":h<17?"Good afternoon":"Good evening";
 const ss=S.subjects.filter(s=>s.date&&days(s.date)>=0).sort((a,b)=>days(a.date)-days(b.date))[0];
 let ring="";
 if(ss){const d=days(ss.date),f=Math.min(1,Math.max(.04,1-d/60)),C=2*Math.PI*34;
  ring='<div class="ring" title="'+esc(ss.name)+' exam"><svg viewBox="0 0 80 80"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--ac2)"/><stop offset="1" style="stop-color:var(--ac)"/></linearGradient></defs><circle cx="40" cy="40" r="34" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="7"/><circle cx="40" cy="40" r="34" fill="none" stroke="url(#rg)" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-f)+'" transform="rotate(-90 40 40)"/></svg><div class="rt"><b>'+d+'</b><span>days · '+esc(ss.name.slice(0,9))+'</span></div></div>'}
 const q=QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length];
 return '<div class="hero"><div class="lvl"><small>LEVEL</small><b>'+l+'</b></div><div class="hmid"><div class="gr">'+gr+'! You\'re a '+ttl(l)+'</div><div class="xpb"><i style="width:'+pc+'%"></i></div><div class="mu">'+S.xp+' XP · '+(n-S.xp)+' to level '+(l+1)+(st?' · <span class="fl">🔥</span> '+st+'-day streak':'')+'</div></div>'+ring+'<div class="qt">“'+q+'”</div></div>'}
function quests(){const q=qd();
 return '<div class="card"><h2>🎯 Daily quests <span class="mu">· +20 XP each</span></h2>'+QS.map(([k,n,l,i])=>{const v=Math.min(q[k],n),d=v>=n;
  return '<div class="qrow '+(d?'qdone':'')+'"><span>'+i+'</span><span class="qn" style="min-width:170px">'+l+'</span><div class="bar"><i style="width:'+v/n*100+'%"></i></div><span class="mu">'+(d?'✔':v+'/'+n)+'</span></div>'}).join('')+'</div>'}
function chk(){const b=badges().filter(x=>x[2]).map(x=>x[1]);
 if(!S.seen){S.seen=b;save();return}
 b.forEach(n=>{if(!S.seen.includes(n)){S.seen.push(n);save();toast("🏅 Badge unlocked: "+n);boom(90)}})}

const _R=window.render;
window.render=function(){_R();
 if(S.tab=="dash"){const v=$("#view");v.insertAdjacentHTML("afterbegin",hero());
  const g=v.querySelector(".grid");if(g)g.insertAdjacentHTML("afterend",quests())}
 chk()};
render();
})();
</script></body></html>
